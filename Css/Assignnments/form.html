<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <fieldset>
        <legend>Registration Form</legend>
    <form>
        <table>
            <tr>
                <td><label for="name">Full Name</label></td>
                <td><input type="text" placeholder="Enter Your Name"></td>
            </tr>
            <tr>
                <td><label for="password">Password</label></td>
                <td><input type="password" placeholder="Enter Your Password"></td>
            </tr>
            <tr>
                <td><label for="address">Address</label></td>
                <td><input type="text" placeholder="Enter Yours Address"></td>
            </tr>
            <tr>
                <td><label for="date">Date of Birth</label></td>
                <td><input type="date" placeholder="Enter your dob"></td>
            </tr>
            <tr>
                <td><label for="gender">Gender:</label></td>
                <td>
                    <input type="radio" name="gender" value="male">male
                    <input type="radio" name="gender" value="female">female
                    <input type="radio" name="gender" value="others">others
                </td>
            </tr>
            <tr>
                <td><label for="college">College:</label></td>
                <td><input type="text" ="college" placeholder="Enter Your College Name"></td>
            </tr>
            <tr>
                <td><p>Hobbies:</p></td>
                <td>
                    <input type="checkbox" value="chess">Chess <br>
                    <input type="checkbox" value="cricket"> Cricket<br>

                    <input type="checkbox" value="football">Football <br>
                    <input type="checkbox" value="basketball">Basketball <br>

                    <input type="checkbox" value="volleyball">Volleyball <br>
                    <input type="checkbox" value="batminton">Badminton <br>

                    <input type="checkbox" value="ludo">Ludo <br> 
                </td>
            </tr>
            <tr>
                <td><p>Feedback:</p></td>
                <td><textarea placeholder="Enter Your Feedback" rows="20" cols="30"></textarea></td>

            </tr>
            <tr>
                <td><input type="submit" value="Submit"></td>
                <td><input type="reset" value="Reset"></td>
            </tr>           
        </table>
    </form>
    </fieldset>
    </body>
    </html>
